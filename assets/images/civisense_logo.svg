<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="CiviSense AI logo">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D1B2A;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1A2E44;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00B4D8;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0077B6;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="pillarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00B4D8;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0077B6;stop-opacity:0.7"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="200" height="200" rx="36" fill="url(#bgGrad)"/>

  <!-- Civic building: base platform -->
  <rect x="28" y="148" width="144" height="10" rx="3" fill="url(#accentGrad)" opacity="0.9"/>

  <!-- Civic building: three pillars -->
  <rect x="44" y="100" width="18" height="48" rx="2" fill="url(#pillarGrad)"/>
  <rect x="91" y="100" width="18" height="48" rx="2" fill="url(#pillarGrad)"/>
  <rect x="138" y="100" width="18" height="48" rx="2" fill="url(#pillarGrad)"/>

  <!-- Civic building: pediment / roof -->
  <polygon points="100,56 28,100 172,100" fill="url(#accentGrad)" opacity="0.95"/>

  <!-- Roof ridge line -->
  <line x1="28" y1="100" x2="172" y2="100" stroke="#00B4D8" stroke-width="2" opacity="0.5"/>

  <!-- AI pulse arc — top of dome suggesting intelligence -->
  <path d="M 74 68 Q 100 40 126 68" stroke="#00E5FF" stroke-width="2.5" fill="none" opacity="0.75" stroke-linecap="round"/>
  <path d="M 82 62 Q 100 48 118 62" stroke="#90E0EF" stroke-width="1.5" fill="none" opacity="0.5" stroke-linecap="round"/>

  <!-- Central node dot at apex -->
  <circle cx="100" cy="56" r="5" fill="#00E5FF" opacity="0.9"/>

  <!-- Connector dots at pillar tops suggesting data nodes -->
  <circle cx="53" cy="100" r="3" fill="#00B4D8" opacity="0.8"/>
  <circle cx="100" cy="100" r="3" fill="#00B4D8" opacity="0.8"/>
  <circle cx="147" cy="100" r="3" fill="#00B4D8" opacity="0.8"/>

  <!-- Connecting lines: data flow between pillars and apex -->
  <line x1="53" y1="100" x2="100" y2="56" stroke="#00B4D8" stroke-width="1" opacity="0.3" stroke-dasharray="3,3"/>
  <line x1="100" y1="100" x2="100" y2="56" stroke="#00B4D8" stroke-width="1" opacity="0.3" stroke-dasharray="3,3"/>
  <line x1="147" y1="100" x2="100" y2="56" stroke="#00B4D8" stroke-width="1" opacity="0.3" stroke-dasharray="3,3"/>
</svg>
